spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/dockdb
    username: dockuser
    password: dockpass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

logging:
  level:
    org.springframework: INFO
    com.dock.digital: DEBUG
