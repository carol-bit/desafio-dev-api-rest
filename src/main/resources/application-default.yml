spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/dockdb
    username: dockuser
    password: dockpass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # MUITO IMPORTANTE: Mude de 'update' para 'none' para evitar conflitos com o Flyway
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # Adiciona o dialeto do PostgreSQL para melhor compatibilidade
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    detectEncoding: true

server:
  port: 8080

logging:
  level:
    org.springframework: INFO
    com.dock.digital: DEBUG

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    url: /v3/api-docs


